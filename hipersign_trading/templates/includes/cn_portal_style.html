<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
body{background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);font-size:14px;margin:0}
.cw{max-width:1120px;width:100%;min-width:0;box-sizing:border-box;margin:0 auto;padding:20px 16px 40px}
body>*,main,.page-content,.page_content{min-width:0;max-width:100vw}
.pv{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px dashed #cbd5e1;border-radius:10px;padding:9px 14px;color:#475569;font-size:13px;margin-bottom:14px;background:#fff}
.pv select,.sel{max-width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;height:34px;padding:0 10px;font:inherit;background:#fff;max-width:100%}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:linear-gradient(135deg,#13235b,#2443b8);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px}
.hd b{font-size:18px;display:block}.hd small{opacity:.85}.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd a,.hd select{color:#13235b}.hd a.out{color:#fff;opacity:.85;font-size:13px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kp small{color:var(--mut);font-size:12.5px}.kp b{display:block;font-size:19px;margin-top:4px}
.kp span{color:var(--mut);font-size:12px}
.tb{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:14px}
.tb a{padding:7px 13px;border-radius:8px;color:#334155;font-weight:500;text-decoration:none;font-size:13.5px}.tb a.on{background:#eff6ff;color:var(--blue);font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:15px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}table.t th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid #f1f5f9;vertical-align:top}table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto;max-width:100%}.card{min-width:0;box-sizing:border-box;max-width:100%}table.t td.d{white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap}
.pill.green{background:#dcfce7;color:#15803d}.pill.blue{background:#dbeafe;color:#1d4ed8}.pill.orange{background:#fef3c7;color:#b45309}.pill.red{background:#fee2e2;color:#b91c1c}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.r{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}.bar i{display:block;height:8px;background:var(--green)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.ph figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph img{width:100%;height:150px;object-fit:cover;display:block}.ph figcaption{padding:8px 10px;font-size:12.5px}.ph figcaption span{display:block;color:var(--mut);font-size:11.5px}
.mut{color:var(--mut);font-size:12.5px}.in{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;box-sizing:border-box;margin:4px 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}
.rep{border-top:1px solid #f1f5f9;padding-top:8px;margin-top:8px}.rep ul{margin:4px 0 4px 18px;padding:0}
.ok{background:#dcfce7;color:#15803d;border-radius:8px;padding:9px 12px;margin-bottom:10px}
@media(max-width:640px){.hd b{font-size:16px}.cw{padding:10px 8px 30px}}
</style>
